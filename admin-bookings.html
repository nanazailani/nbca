<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Bookings | Nb.CA Admin</title>
    <script>if (!localStorage.getItem('rp_admin')) { location.replace('admin-login.html'); }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            screens: { xs: '420px' },
            colors: { amberGold: '#2563EB', royalBlue: '#1E40AF', navy: '#172554' },
            fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
        } } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        main > * { animation: rise .4s ease both; } main > *:nth-child(2) { animation-delay: .05s; } main > *:nth-child(3) { animation-delay: .1s; } main > *:nth-child(4) { animation-delay: .15s; }
        @media (prefers-reduced-motion: reduce) { main > * { animation: none; } }
        @media print { #a-sidebar, #a-topbar, #a-bottomnav, .no-print { display: none !important; } .lg\:pl-64 { padding-left: 0 !important; } }
    </style>
</head>
<body data-page="bookings" data-title="Class Bookings" data-sub="Confirm seats, reschedule and export certificates" class="text-slate-800 antialiased selection:bg-amberGold selection:text-white">
    <div id="a-overlay"></div>
    <aside id="a-sidebar"></aside>
    <div class="lg:pl-64 min-h-screen flex flex-col min-w-0 overflow-x-hidden">
        <header id="a-topbar"></header>
        <main class="flex-1 min-w-0 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-6 lg:py-10 pb-28 lg:pb-14 space-y-8">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                <div><span class="text-[11px] font-extrabold tracking-[0.18em] text-amberGold uppercase">Daily class</span><h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">Class Bookings</h2></div>
                <div class="flex flex-wrap gap-2 self-start"><div class="inline-flex p-1 rounded-full bg-white border border-slate-200 text-xs font-bold" id="view-switch"></div><button type="button" onclick="Bookings.exportCsv(false)" class="px-4 py-2.5 bg-white border border-slate-200 hover:border-amberGold text-slate-700 font-bold rounded-full text-xs transition-all"><i class="fa-solid fa-file-csv text-amberGold mr-1.5"></i>Export</button><button type="button" onclick="Bookings.exportCsv(true)" class="px-4 py-2.5 bg-amberGold hover:bg-royalBlue text-white font-bold rounded-full text-xs shadow transition-all" title="Admitted students: name and IC"><i class="fa-solid fa-award mr-1.5"></i>Certificate list</button></div>
            </div>
            <section class="space-y-3">
                <div id="chips" class="flex flex-wrap gap-2"></div>
                <div id="search-row" class="flex flex-col sm:flex-row gap-3"><div class="relative flex-1"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i><input id="q" oninput="Bookings.render()" placeholder="Search name, IC, phone, email or cafe" class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-xs focus:outline-none focus:border-amberGold"></div><select id="scope" onchange="Bookings.render()" class="bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-amberGold"><option value="upcoming">Upcoming sessions</option><option value="past">Past sessions</option><option value="all">All dates</option></select></div>
                <div id="active-slot" class="hidden"></div>
            </section>
            <section id="list" class="space-y-4"></section>
            <section id="capacity" class="hidden space-y-4"></section>
        </main>
    </div>
    <nav id="a-bottomnav" aria-label="Primary"></nav>

    <script src="js/nbca-config.js"></script>
    <script src="js/nbca-data.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/admin/shell.js"></script>
    <script src="js/admin/ui.js"></script>
    <script src="js/admin/bookings.js"></script>
</body>
</html>
