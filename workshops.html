<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshops | Nb.CA Academy</title>
    <script>if (!localStorage.getItem('rp_logged_user')) { location.replace('auth.html?next=' + encodeURIComponent(location.pathname.split('/').pop() || 'dashboard.html')); }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { xs: '420px' },
                    colors: {
                        roast: {
                            50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 400: '#94A3B8',
                            500: '#64748B', 600: '#475569', 700: '#334155', 800: '#1E293B', 900: '#1E40AF', 950: '#172554'
                        },
                        amberGold: '#2563EB',
                        royalBlue: '#1E40AF',
                        navy: '#172554'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC;
            background-image: radial-gradient(circle at 8% 5%, rgba(37,99,235,0.06) 0%, transparent 30%), radial-gradient(circle at 95% 8%, rgba(30,64,175,0.05) 0%, transparent 28%);
            background-attachment: fixed; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        main > * { animation: rise .45s ease both; } main > *:nth-child(2) { animation-delay: .06s; } main > *:nth-child(3) { animation-delay: .12s; } main > *:nth-child(4) { animation-delay: .18s; }
        @media (prefers-reduced-motion: reduce) { main > * { animation: none; } }
        @media print { #m-sidebar, #m-topbar, #m-bottomnav { display: none !important; } }
    </style>
</head>
<body data-page="workshops" data-title="Workshops" data-sub="Professional coffee workshops, in person or online" class="text-roast-900 antialiased selection:bg-amberGold selection:text-white">
    <div id="m-overlay"></div>
    <aside id="m-sidebar"></aside>
    <div class="lg:pl-72 min-h-screen flex flex-col min-w-0 overflow-x-hidden">
        <header id="m-topbar"></header>
        <main class="flex-1 min-w-0 w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-10 py-6 lg:py-10 pb-28 lg:pb-14 space-y-10">

            <section>
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 mb-5">
                <div><span class="text-[11px] font-extrabold tracking-[0.18em] text-amberGold uppercase">Level up</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-roast-950 mt-1">Workshops</h2></div>
                
            </div>
                <div id="ws-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </section>

        </main>
    </div>
    <nav id="m-bottomnav" aria-label="Primary"></nav>

    <div id="ws-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeWorkshop()"></div>
        <div class="relative bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeWorkshop()" class="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-white/90 border border-roast-200 text-roast-800 flex items-center justify-center shadow" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            <div id="ws-modal-body"></div>
        </div>
    </div>

    <script src="js/catalog.js"></script>
    <script src="js/nbca-config.js"></script>
    <script src="js/nbca-data.js"></script>
    <script src="js/billplz.js"></script>
    <script src="js/member-shell.js"></script>
    <script>

        const C = window.NBCA_CATALOG.workshops;
        let cur = null, curMode = null, curSlot = null, curVoucher = null, payStep = false, wsProof = '';
        const esc = MemberShell.esc;

        const seatsUsed = (w, slot) => JSON.parse(localStorage.getItem('rp_workshop_enrollments') || '[]').filter(x => x.workshopId === w.id && x.slot === slot && x.status !== 'Cancelled').length;
        const slotList = () => NBCA_DATA.slots.forWorkshop(cur)[curMode] || [];

        function renderGrid() {
            document.getElementById('ws-grid').innerHTML = C.map(w =>
                '<button onclick="openWorkshop(\'' + w.id + '\')" class="group text-left bg-white rounded-2xl border border-roast-200 overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 hover:border-amberGold/40 transition-all">' +
                '<div class="relative h-44 overflow-hidden"><img src="' + esc(w.image) + '" alt="' + esc(w.title) + '" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"><span class="absolute top-3 left-3 px-2.5 py-1 bg-white/95 text-amberGold text-[10px] font-bold rounded-full">' + esc(w.badge) + '</span></div>' +
                '<div class="p-5 space-y-2"><h3 class="font-serif text-lg font-bold text-roast-950">' + esc(w.title) + '</h3><p class="text-[11px] text-roast-500">' + esc(w.subtitle) + '</p><p class="text-xs text-roast-600 line-clamp-2">' + esc(w.description) + '</p>' +
                '<div class="flex items-center justify-between pt-3"><span class="text-amberGold font-extrabold">RM ' + w.price.toFixed(2) + '</span><span class="text-[11px] font-bold text-amberGold">View &amp; enroll <i class="fa-solid fa-arrow-right text-[9px]"></i></span></div></div></button>').join('');
        }

        function openWorkshop(id) {
            cur = C.find(w => w.id === id);
            curMode = Object.keys(cur.modes)[0];
            curSlot = null; curVoucher = null; payStep = false; wsProof = '';
            renderModal();
            document.getElementById('ws-modal').classList.remove('hidden');
        }
        function closeWorkshop() { document.getElementById('ws-modal').classList.add('hidden'); }

        function pricing() {
            const v = NBCA_DATA.loyalty.available((MemberShell.user() || {}).email, 'class').find(x => x.code === curVoucher) || null;
            const discount = NBCA_DATA.loyalty.discount(v, { subtotal: cur.price, shipping: 0 });
            return { list: cur.price, price: cur.price - discount, discount, voucher: v };
        }

        function renderModal() {
            const w = cur, cap = NBCA_DATA.slots.capacity(w), P = pricing();
            if (payStep && curSlot) { renderPayPanel(); return; }
            const mine = NBCA_DATA.loyalty.available((MemberShell.user() || {}).email, 'class');
            const modes = Object.keys(w.modes).map(k => '<button onclick="pickMode(\'' + k + '\')" class="px-4 py-2.5 rounded-xl text-xs font-bold border transition-all ' + (k === curMode ? 'bg-amberGold text-white border-amberGold shadow' : 'bg-roast-50 text-roast-700 border-roast-200 hover:border-amberGold') + '">' + esc(w.modes[k].label) + '</button>').join('');
            const slots = slotList().map((s, i) => {
                const left = cap - seatsUsed(w, s), full = left <= 0;
                return '<button ' + (full ? 'disabled' : 'onclick="pickSlot(' + i + ')"') + ' class="px-4 py-2.5 rounded-xl text-xs font-semibold border text-left transition-all ' + (full ? 'bg-roast-100 border-roast-200 text-roast-400 cursor-not-allowed' : curSlot === s ? 'bg-emerald-50 border-emerald-400 text-emerald-700 ring-2 ring-emerald-300' : 'bg-white text-roast-700 border-roast-200 hover:border-amberGold') + '">' + esc(s) + '<span class="block text-[10px] font-medium ' + (full ? 'text-red-500' : 'text-roast-500') + '">' + (full ? 'Fully booked' : left + ' seat' + (left > 1 ? 's' : '') + ' left') + '</span></button>';
            }).join('') || '<p class="text-xs text-roast-500 sm:col-span-2">No sessions scheduled yet. Please check back soon.</p>';
            const voucherBox = mine.length ? '<div class="space-y-1.5"><p class="text-[11px] font-bold uppercase text-roast-500"><i class="fa-solid fa-ticket text-amberGold mr-1"></i>Voucher</p><select onchange="pickVoucher(this.value)" class="w-full bg-white border border-roast-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-amberGold"><option value="">No voucher</option>' + mine.map(v => '<option value="' + esc(v.code) + '" ' + (v.code === curVoucher ? 'selected' : '') + '>' + esc(v.title) + ' (' + esc(v.code) + ')</option>').join('') + '</select></div>' : '';
            document.getElementById('ws-modal-body').innerHTML =
                '<div class="grid md:grid-cols-5">' +
                '<div class="md:col-span-2 h-48 md:h-auto"><img src="' + esc(w.image) + '" alt="" class="w-full h-full object-cover md:rounded-l-3xl"></div>' +
                '<div class="md:col-span-3 p-6 sm:p-8 space-y-5">' +
                    '<div><span class="text-[10px] font-extrabold tracking-widest text-amberGold uppercase">' + esc(w.subtitle) + '</span><h3 class="font-serif text-2xl font-extrabold text-roast-950 mt-1">' + esc(w.title) + '</h3><p class="text-xs text-roast-600 mt-2">' + esc(w.description) + '</p></div>' +
                    '<ul class="grid grid-cols-2 gap-x-3 gap-y-1.5 text-[11px] text-roast-700">' + w.highlights.map(h => '<li><i class="fa-solid fa-check text-amberGold text-[9px] mr-1.5"></i>' + esc(h) + '</li>').join('') + '</ul>' +
                    '<div class="space-y-2"><p class="text-[11px] font-bold uppercase text-roast-500">Mode</p><div class="flex flex-wrap gap-2">' + modes + '</div><p class="text-[11px] text-roast-500">' + esc(w.modes[curMode].note) + '</p></div>' +
                    '<div class="space-y-2"><p class="text-[11px] font-bold uppercase text-roast-500">Choose a slot</p><div class="grid sm:grid-cols-2 gap-2">' + slots + '</div></div>' +
                    voucherBox +
                    '<div class="flex items-center justify-between pt-4 border-t border-roast-100"><div><span class="block text-[10px] uppercase text-roast-500">Fee</span><strong class="font-serif text-2xl text-amberGold">RM ' + P.price.toFixed(2) + '</strong>' + (P.discount ? '<span class="ml-2 text-xs text-roast-400 line-through">RM ' + P.list.toFixed(2) + '</span>' : '') + '</div>' +
                    '<button onclick="goPay()" ' + (curSlot ? '' : 'disabled') + ' class="px-6 py-3 bg-amberGold hover:bg-royalBlue text-white font-bold rounded-xl text-xs shadow-lg disabled:opacity-40 disabled:cursor-not-allowed">Continue to payment</button></div>' +
                '</div></div>';
        }

        // Phase-1 manual payment: show the DuitNow QR + bank details and take a receipt upload (UC-300).
        function renderPayPanel() {
            const w = cur, P = pricing(), pay = NBCA_DATA.payment.get();
            const qr = pay.qrImage ? '<div class="flex justify-center"><img src="' + esc(pay.qrImage) + '" alt="DuitNow QR" class="w-40 h-40 object-contain rounded-xl bg-white border border-roast-200 p-2"></div>' : '';
            const bank = (pay.bankName || pay.accountNumber) ? '<div class="bg-white rounded-xl border border-roast-200 p-3 space-y-1 text-xs"><div class="flex justify-between"><span class="text-roast-500">Bank</span><strong class="text-roast-950">' + esc(pay.bankName || '-') + '</strong></div><div class="flex justify-between"><span class="text-roast-500">Account name</span><strong class="text-roast-950">' + esc(pay.accountName || '-') + '</strong></div><div class="flex justify-between"><span class="text-roast-500">Account no.</span><strong class="text-roast-950">' + esc(pay.accountNumber || '-') + '</strong></div></div>' : '';
            const none = (!qr && !bank) ? '<p class="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2">Payment details are not set up yet. Please contact us on WhatsApp to pay.</p>' : '';
            document.getElementById('ws-modal-body').innerHTML =
                '<div class="p-6 sm:p-8 space-y-5">' +
                    '<div class="flex items-start justify-between gap-3"><div><span class="text-[10px] font-extrabold tracking-widest text-amberGold uppercase">Payment</span><h3 class="font-serif text-xl font-extrabold text-roast-950 mt-1">' + esc(w.title) + '</h3></div></div>' +
                    '<div class="bg-roast-50 rounded-xl p-4 border border-roast-200 space-y-1.5 text-xs"><div class="flex justify-between"><span class="text-roast-600">Slot</span><strong class="text-roast-950">' + esc(curSlot) + '</strong></div><div class="flex justify-between"><span class="text-roast-600">Mode</span><strong class="text-roast-950">' + esc(w.modes[curMode].label) + '</strong></div><div class="flex justify-between text-amberGold font-bold"><span>Amount to pay now</span><span>RM ' + P.price.toFixed(2) + '</span></div></div>' +
                    '<div class="rounded-xl border border-amberGold bg-blue-50 p-4 text-xs space-y-3"><p class="font-bold text-roast-950"><i class="fa-solid fa-qrcode text-amberGold mr-1.5"></i>Pay by DuitNow QR or bank transfer</p>' + qr + bank + none + (pay.note ? '<p class="text-[10px] text-roast-600">' + esc(pay.note) + '</p>' : '') + '</div>' +
                    '<div><label class="block text-[11px] font-bold uppercase text-roast-500 mb-1">Upload payment receipt *</label><label for="ws-proof-file" class="cursor-pointer flex items-center gap-2 px-4 py-3 bg-white border border-dashed border-roast-300 rounded-xl text-roast-500 hover:border-amberGold hover:text-amberGold transition-all"><i class="fa-solid fa-cloud-arrow-up"></i><span id="ws-proof-name" class="truncate">' + (wsProof ? 'Receipt ready' : 'Choose receipt (JPG, PNG or PDF, up to 5 MB)') + '</span></label><input type="file" id="ws-proof-file" accept="image/*,application/pdf" class="hidden" onchange="wsHandleProof(event)">' + (wsProof ? '<img src="' + esc(wsProof) + '" class="mt-2 w-24 h-24 object-cover rounded-xl border border-roast-200" alt="Receipt preview">' : '') + '</div>' +
                    '<p class="text-[10px] text-roast-500 text-center">After you submit, our team verifies your receipt and confirms your seat.</p>' +
                    '<div class="flex gap-3"><button type="button" onclick="backToSelect()" class="flex-1 py-3 bg-roast-100 hover:bg-roast-200 text-roast-700 font-bold rounded-xl text-xs border border-roast-200">Back</button>' +
                    '<button type="button" onclick="wsSubmitProof()" class="flex-[2] py-3 bg-amberGold hover:bg-royalBlue text-white font-bold rounded-xl text-xs shadow-lg"><i class="fa-solid fa-paper-plane mr-1"></i> Submit payment proof</button></div>' +
                '</div>';
        }
        function goPay() { if (!curSlot) return; payStep = true; renderModal(); }
        function backToSelect() { payStep = false; renderModal(); }
        function wsHandleProof(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { showToast('That file is larger than 5 MB.'); event.target.value = ''; return; }
            if (!(file.type.startsWith('image/') || file.type === 'application/pdf')) { showToast('Please upload a JPG, PNG or PDF receipt.'); event.target.value = ''; return; }
            const r = new FileReader();
            r.onload = () => {
                if (file.type.startsWith('image/')) {
                    const img = new Image();
                    img.onload = () => { const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); wsProof = c.toDataURL('image/jpeg', 0.85); renderModal(); };
                    img.src = r.result;
                } else { wsProof = r.result; renderModal(); }
            };
            r.readAsDataURL(file);
        }
        function pickMode(k) { curMode = k; curSlot = null; renderModal(); }
        function pickSlot(i) { curSlot = slotList()[i]; renderModal(); }
        function pickVoucher(code) { curVoucher = code || null; renderModal(); }

        // Saves the enrolment with the uploaded receipt (Phase-1 manual payment). The admin verifies it before confirming.
        function wsSubmitProof() {
            if (!curSlot) return;
            if (!wsProof) { showToast('Please upload your payment receipt first.'); return; }
            const u = MemberShell.user() || {};
            const all = (() => { try { return JSON.parse(localStorage.getItem('rp_workshop_enrollments') || '[]'); } catch (e) { return []; } })();
            if (all.some(x => (x.email || '').toLowerCase() === (u.email || '').toLowerCase() && x.workshopId === cur.id && x.slot === curSlot && x.status !== 'Cancelled')) {
                showToast('You already have this slot. Check My Classes.');
                return;
            }
            if (seatsUsed(cur, curSlot) >= NBCA_DATA.slots.capacity(cur)) { showToast('Sorry, that slot just filled up.'); payStep = false; renderModal(); return; }
            const P = pricing();
            const rec = {
                id: 'WS-' + Date.now(), ref: 'RP-WS-' + String(Date.now()).slice(-6),
                email: u.email, name: u.name, workshopId: cur.id, title: cur.title,
                mode: curMode, modeLabel: cur.modes[curMode].label, location: cur.modes[curMode].location,
                slot: curSlot, price: P.price, listPrice: P.list, discount: P.discount,
                voucher: P.voucher ? { code: P.voucher.code, title: P.voucher.title } : null,
                status: 'Pending Payment', paymentStatus: 'Submitted', proofImage: wsProof, proofUploadedAt: new Date().toISOString(),
                createdAt: new Date().toISOString()
            };
            all.push(rec);
            try { localStorage.setItem('rp_workshop_enrollments', JSON.stringify(all)); }
            catch (e) { showToast('That receipt is too large to save. Please try a smaller file.'); return; }
            if (P.voucher) NBCA_DATA.loyalty.use(P.voucher.code, rec.id);
            closeWorkshop();
            showToast('Receipt submitted. We will verify it and confirm your seat shortly.');
        }
        renderGrid();
    </script>
</body>
</html>
