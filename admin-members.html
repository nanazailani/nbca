<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | Nb.CA Admin</title>
    <script>if (!localStorage.getItem('rp_admin')) { location.replace('admin-login.html'); }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            screens: { xs: '420px' },
            colors: { amberGold: '#2563EB', royalBlue: '#1E40AF', navy: '#172554' },
            fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
        } } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        main > * { animation: rise .4s ease both; } main > *:nth-child(2) { animation-delay: .05s; } main > *:nth-child(3) { animation-delay: .1s; } main > *:nth-child(4) { animation-delay: .15s; }
        @media (prefers-reduced-motion: reduce) { main > * { animation: none; } }
        @media print { #a-sidebar, #a-topbar, #a-bottomnav, .no-print { display: none !important; } .lg\:pl-64 { padding-left: 0 !important; } }
    </style>
</head>
<body data-page="members" data-title="Members" data-sub="Manage member accounts" class="text-slate-800 antialiased selection:bg-amberGold selection:text-white">
    <div id="a-overlay"></div>
    <aside id="a-sidebar"></aside>
    <div class="lg:pl-64 min-h-screen flex flex-col min-w-0 overflow-x-hidden">
        <header id="a-topbar"></header>
        <main class="flex-1 min-w-0 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-6 lg:py-10 pb-28 lg:pb-14 space-y-8">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                <div><span class="text-[11px] font-extrabold tracking-[0.18em] text-amberGold uppercase">People</span><h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">Members</h2></div>
                <div class="flex flex-wrap gap-2 self-start"><button type="button" onclick="Members.add()" class="px-4 py-2.5 bg-amberGold hover:bg-royalBlue text-white font-bold rounded-full text-xs shadow transition-all"><i class="fa-solid fa-plus mr-1.5"></i>Add member</button><button type="button" onclick="Members.exportCsv()" class="px-4 py-2.5 bg-white border border-slate-200 hover:border-amberGold text-slate-700 font-bold rounded-full text-xs transition-all"><i class="fa-solid fa-file-csv text-amberGold mr-1.5"></i>Export</button></div>
            </div>
            <section id="summary" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></section>
            <section class="space-y-3"><div id="chips" class="flex flex-wrap gap-2"></div><div class="flex flex-col sm:flex-row gap-3"><div class="relative flex-1"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i><input id="q" oninput="Members.render()" placeholder="Search name, email, phone or IC" class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-xs focus:outline-none focus:border-amberGold"></div><select id="sort" onchange="Members.render()" class="bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-amberGold"><option value="recent">Recently active</option><option value="newest">Newest first</option><option value="points">Most points</option><option value="spend">Highest spend</option><option value="name">Name A–Z</option></select></div></section>
            <section id="list" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></section>
        </main>
    </div>
    <nav id="a-bottomnav" aria-label="Primary"></nav>
    <div id="drawer" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="Members.closeDrawer()"></div>
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-lg bg-white shadow-2xl flex flex-col">
            <div class="h-16 px-6 flex items-center justify-between border-b border-slate-100 shrink-0"><h3 class="font-serif text-lg font-bold text-slate-900">Member details</h3><button type="button" onclick="Members.closeDrawer()" class="w-9 h-9 rounded-full hover:bg-slate-100 text-slate-600" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
            <div id="drawer-body" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
        </div>
    </div>
    <script src="js/nbca-config.js"></script>
    <script src="js/nbca-data.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/admin/shell.js"></script>
    <script src="js/admin/ui.js"></script>
    <script src="js/admin/members.js"></script>
</body>
</html>
