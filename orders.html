<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Nb.CA Academy</title>
    <script>if (!localStorage.getItem('rp_logged_user')) { location.replace('auth.html?next=' + encodeURIComponent(location.pathname.split('/').pop() || 'dashboard.html')); }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { xs: '420px' },
                    colors: {
                        roast: {
                            50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 400: '#94A3B8',
                            500: '#64748B', 600: '#475569', 700: '#334155', 800: '#1E293B', 900: '#1E40AF', 950: '#172554'
                        },
                        amberGold: '#2563EB',
                        royalBlue: '#1E40AF',
                        navy: '#172554'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC;
            background-image: radial-gradient(circle at 8% 5%, rgba(37,99,235,0.06) 0%, transparent 30%), radial-gradient(circle at 95% 8%, rgba(30,64,175,0.05) 0%, transparent 28%);
            background-attachment: fixed; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        main > * { animation: rise .45s ease both; } main > *:nth-child(2) { animation-delay: .06s; } main > *:nth-child(3) { animation-delay: .12s; } main > *:nth-child(4) { animation-delay: .18s; }
        @media (prefers-reduced-motion: reduce) { main > * { animation: none; } }
        @media print { #m-sidebar, #m-topbar, #m-bottomnav { display: none !important; } }
    </style>
</head>
<body data-page="orders" data-title="My Orders" data-sub="Track your coffee and merchandise orders" class="text-roast-900 antialiased selection:bg-amberGold selection:text-white">
    <div id="m-overlay"></div>
    <aside id="m-sidebar"></aside>
    <div class="lg:pl-72 min-h-screen flex flex-col min-w-0 overflow-x-hidden">
        <header id="m-topbar"></header>
        <main class="flex-1 min-w-0 w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-10 py-6 lg:py-10 pb-28 lg:pb-14 space-y-10">

            <section>
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 mb-5">
                <div><span class="text-[11px] font-extrabold tracking-[0.18em] text-amberGold uppercase">Order tracking</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-roast-950 mt-1">My Orders</h2></div>
                <a href="shop.html" class="inline-flex items-center gap-2 px-4 py-2.5 bg-amberGold hover:bg-royalBlue text-white font-bold rounded-full text-xs shadow transition-all self-start"><i class="fa-solid fa-plus text-[10px]"></i> New order</a>
            </div>
                <div id="order-list" class="space-y-5"></div>
            </section>

        </main>
    </div>
    <nav id="m-bottomnav" aria-label="Primary"></nav>

    <div id="receipt-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeReceipt()"></div>
        <div class="relative bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
            <button onclick="closeReceipt()" class="absolute top-4 right-4 text-roast-500 hover:text-roast-950 p-2" aria-label="Close"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div class="text-center space-y-1"><div class="w-12 h-12 rounded-full bg-blue-50 text-amberGold flex items-center justify-center mx-auto"><i class="fa-solid fa-receipt"></i></div><h3 class="font-serif text-xl font-bold text-roast-950">Order Receipt</h3><p id="rc-id" class="text-xs text-roast-500"></p></div>
            <div id="rc-body" class="bg-roast-50 p-4 rounded-2xl border border-roast-200 space-y-2 text-xs"></div>
            <div class="flex gap-3"><button onclick="window.print()" class="flex-1 py-3 bg-amberGold hover:bg-royalBlue text-white font-bold rounded-xl text-xs"><i class="fa-solid fa-print mr-1"></i> Print</button><button onclick="closeReceipt()" class="px-5 py-3 bg-roast-100 text-roast-800 font-bold rounded-xl text-xs">Close</button></div>
        </div>
    </div>

    <script src="js/nbca-config.js"></script>
    <script src="js/nbca-data.js"></script>
    <script src="js/billplz.js"></script>
    <script src="js/member-shell.js"></script>
    <script>

        const STEPS = [['Pending Payment', 'fa-credit-card', 'Payment'], ['Processing', 'fa-box', 'Processing'], ['Shipped', 'fa-truck-fast', 'Shipped'], ['Completed', 'fa-check', 'Completed']];
        const esc = MemberShell.esc, money = MemberShell.money;
        let orders = [];

        function render() {
            orders = MemberShell.myOrders().slice().reverse();
            const box = document.getElementById('order-list');
            if (!orders.length) {
                box.innerHTML = '<div class="bg-white rounded-3xl border border-dashed border-roast-300 p-10 text-center space-y-3"><div class="w-14 h-14 rounded-2xl bg-blue-50 text-amberGold flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-box-open"></i></div><h3 class="font-serif text-xl font-bold text-roast-950">No orders yet</h3><p class="text-xs text-roast-500">Your coffee bean and merchandise orders will appear here.</p><a href="shop.html" class="inline-flex items-center gap-2 px-5 py-2.5 bg-amberGold hover:bg-royalBlue text-white font-bold rounded-full text-xs shadow">Shop coffee beans <i class="fa-solid fa-arrow-right text-[10px]"></i></a></div>';
                return;
            }
            box.innerHTML = orders.map((o, idx) => {
                const at = Math.max(0, STEPS.findIndex(s => s[0] === o.status));
                const stepper = STEPS.map((s, i) => {
                    const done = i < at, active = i === at;
                    const dot = done ? 'bg-emerald-500 text-white' : active ? 'bg-amberGold text-white ring-4 ring-blue-100' : 'bg-roast-200 text-roast-500';
                    return '<div class="flex flex-col items-center gap-1.5 text-center w-20"><span class="w-9 h-9 rounded-full flex items-center justify-center text-xs ' + dot + '"><i class="fa-solid ' + (done ? 'fa-check' : s[1]) + '"></i></span><span class="text-[10px] font-bold ' + (done || active ? 'text-roast-950' : 'text-roast-400') + '">' + s[2] + '</span></div>' +
                        (i < STEPS.length - 1 ? '<div class="flex-1 h-0.5 mt-[17px] ' + (done ? 'bg-emerald-500' : 'bg-roast-200') + '"></div>' : '');
                }).join('');
                const count = o.items.reduce((a, i) => a + i.qty, 0);
                return '<article class="bg-white rounded-3xl border border-roast-200 shadow-sm p-5 sm:p-6 space-y-5">' +
                    '<div class="flex flex-wrap items-center justify-between gap-3"><div><h3 class="font-serif text-xl font-extrabold text-roast-950">' + esc(o.id) + '</h3><p class="text-xs text-roast-500 mt-0.5">' + new Date(o.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ' &middot; ' + count + ' item' + (count > 1 ? 's' : '') + ' &middot; ' + money(o.total) + '</p></div>' +
                    '<button onclick="openReceipt(' + idx + ')" class="px-4 py-2 bg-roast-100 hover:bg-roast-200 text-amberGold text-xs font-bold rounded-xl border border-roast-200"><i class="fa-solid fa-receipt mr-1.5"></i>View receipt</button></div>' +
                    (o.status === 'Cancelled' ? '<div class="rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs p-3"><i class="fa-solid fa-ban mr-1.5"></i>This order was cancelled. Contact us if you paid and need a refund.</div>' : '<div class="flex items-start justify-between overflow-x-auto min-w-0"><div class="flex items-start justify-between w-full min-w-[420px]">' + stepper + '</div></div>') +
                    (o.tracking ? '<div class="rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-xs p-3"><i class="fa-solid fa-truck mr-1.5"></i>' + esc(o.tracking.courier) + ' tracking no. <strong class="font-mono">' + esc(o.tracking.number) + '</strong></div>' : '') +
                    (o.status === 'Pending Payment' ? '<div class="rounded-xl bg-amber-50 border border-amberGold/30 text-amber-800 text-xs p-3 flex flex-wrap items-center justify-between gap-3"><span>This order is waiting for payment.</span><button onclick="payOrder(\'' + o.id + '\')" class="px-4 py-2 bg-amberGold hover:bg-royalBlue text-white font-bold rounded-lg whitespace-nowrap">Pay ' + money(o.total) + ' with Billplz</button></div>' : '') +
                    '<div class="flex gap-3 overflow-x-auto no-scrollbar">' + o.items.map(i => '<img src="' + esc(i.image) + '" alt="' + esc(i.name) + '" title="' + esc(i.name) + ' x' + i.qty + '" class="w-14 h-14 rounded-xl object-cover border border-roast-200 shrink-0">').join('') + '</div>' +
                '</article>';
            }).join('');
        }
        function payOrder(id) {
            const o = MemberShell.myOrders().find(x => x.id === id);
            if (!o) return;
            NBCA_PAY.checkout({ type: 'order', refId: o.id, amount: o.total, description: 'Order ' + o.id + ' - Nb.CA Academy', name: o.name, email: o.email, phone: o.phone, returnTo: 'orders.html' });
        }
        function openReceipt(i) {
            const o = orders[i];
            document.getElementById('rc-id').innerText = 'Order ' + o.id;
            document.getElementById('rc-body').innerHTML =
                '<div class="flex justify-between pb-2 border-b border-roast-200"><span class="text-roast-500">Date</span><strong>' + new Date(o.createdAt).toLocaleDateString('en-GB') + '</strong></div>' +
                '<div class="flex justify-between pb-2 border-b border-roast-200"><span class="text-roast-500">Status</span><strong class="text-amberGold">' + esc(o.status) + '</strong></div>' +
                '<div class="space-y-1 py-1">' + o.items.map(it => '<div class="flex justify-between text-roast-800"><span>' + it.qty + 'x ' + esc(it.name) + '</span><span>' + money(it.price * it.qty) + '</span></div>').join('') + '</div>' +
                '<div class="flex justify-between text-roast-600 pt-2 border-t border-roast-200"><span>Shipping</span><span>' + money(o.shipping) + '</span></div>' +
                '<div class="flex justify-between text-sm font-bold text-roast-950"><span>Total</span><span class="text-amberGold">' + money(o.total) + '</span></div>' +
                '<div class="pt-2 border-t border-roast-200 text-roast-600"><span class="block text-[10px] uppercase">Deliver to</span>' + esc(o.name) + ', ' + esc(o.phone) + '<br>' + esc(o.address) + '</div>';
            document.getElementById('receipt-modal').classList.remove('hidden');
        }
        function closeReceipt() { document.getElementById('receipt-modal').classList.add('hidden'); }
        window.addEventListener('member-ready', render);

    </script>
</body>
</html>
